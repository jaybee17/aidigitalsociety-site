<script>
const params = new URLSearchParams(location.search);
const sessionId = params.get('session_id'), product = params.get('product');
const card = document.getElementById('ty-card');
const esc = (t) => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function verify(){
  if(!sessionId){ card.innerHTML='<p class="ty-error">Missing session. If you just paid, check your email receipt or write to josee@joseebedard.com.</p>'; return; }
  try{
    const res = await fetch('https://trobqziwskkxclablptx.supabase.co/functions/v1/verify-product-payment',{method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_ZXf00h8HfbURtCQbOhJkpA_oWIE20Cn','Authorization':'Bearer sb_publishable_ZXf00h8HfbURtCQbOhJkpA_oWIE20Cn'},body:JSON.stringify({sessionId,product})});
    const data = await res.json();
    if(!res.ok || !data.verified){ card.innerHTML='<p class="ty-error">'+esc(data.error||'Could not confirm payment')+'. If you were charged, write to josee@joseebedard.com and I will sort it out.</p>'; return; }
    const extras = (data.extras||[]).map(e=>'<a class="ty-btn alt" href="'+esc(e.url)+'" download>'+esc(e.label)+'</a>').join('');
    card.innerHTML = '<h1>you are <em>in.</em></h1><p>Thank you for getting <b>'+esc(data.productName)+'</b>. Your download is ready.</p><a class="ty-btn" href="'+esc(data.downloadUrl)+'" download>Download the guide (PDF) &rarr;</a>'+extras+'<div class="ty-steps"><b>Start here:</b><br>1. Open the PDF and go to page 3.<br>2. It shows you what the zip file is, and how to add it to Claude.<br>3. Then follow the guide one page at a time.</div><p style="margin-top:20px;font-size:14px">I also emailed these links to '+esc(data.email||'you')+'. It can take a few minutes, and it may land in your spam folder.</p>';
  }catch(e){ card.innerHTML='<p class="ty-error">Something went wrong confirming your payment. Please write to josee@joseebedard.com.</p>'; }
}
verify();
</script>
